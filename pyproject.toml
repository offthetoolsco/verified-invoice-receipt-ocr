[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-ocr"
version = "1.0.0"
description = "Math-verified bookkeeping invoice and receipt OCR MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
verified-ocr = "src.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
